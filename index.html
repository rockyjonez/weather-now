<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weather Now</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0b1c3a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Weather">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="description" content="Current conditions and the next 12 hours from the US National Weather Service: temperature, rain, clouds, wind, storms, lightning, snow, fire weather and alerts.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Audiowide&family=Exo+2:wght@400;600;700&display=swap">
<style>
/* Doctor Who styling: TARDIS blue console, amber instrument light, time-vortex backdrop.
   Fan styling only; no BBC assets are used and the page is not affiliated with the BBC. */
:root{
  color-scheme:dark;
  --tardis:#003b6f; --tardis2:#1d5fa8; --amber:#f5b83d; --amber2:#ffd27a;
  --bg:#050b1a; --surface:#0b1c3a; --surface2:#112748; --line:#22437c; --text:#eaf2ff; --text2:#b9c9e6; --muted:#7f95bf;
  --accent:#f5b83d; --accent-ink:#0b1c3a; --grid:#1a3564; --night:rgba(0,0,0,.3);
  --s-blue:#4d9cf0; --s-orange:#e8722f; --s-aqua:#22b384; --s-yellow:#d9a020; --s-magenta:#dd6a97; --s-green:#4fb24f; --s-violet:#a293f0; --s-red:#ef6f6f;
  --sev-extreme:#ff5c5c; --sev-severe:#ef6f6f; --sev-moderate:#d9a020; --sev-minor:#4d9cf0; --sev-unknown:#7f95bf;
  --shadow:0 0 0 1px rgba(120,170,255,.06) inset,0 10px 30px rgba(0,0,0,.45),0 0 28px rgba(29,95,168,.18);
  --glow:0 0 14px rgba(245,184,61,.45);
  --vortex1:#123a7a; --vortex2:#2a1a66; --ring:rgba(90,140,255,.07);
}
[data-theme="light"]{
  color-scheme:light;
  --bg:#e6ecf6; --surface:#ffffff; --surface2:#eef3fb; --line:#c3d2ea; --text:#0b1c3a; --text2:#3a5079; --muted:#6a7fa6;
  --accent:#003b6f; --accent-ink:#ffffff; --grid:#dbe4f2; --night:rgba(0,40,110,.08);
  --s-blue:#2a78d6; --s-orange:#eb6834; --s-aqua:#1baf7a; --s-yellow:#eda100; --s-magenta:#e87ba4; --s-green:#008300; --s-violet:#4a3aa7; --s-red:#e34948;
  --sev-extreme:#b3261e; --sev-severe:#e34948; --sev-moderate:#eda100; --sev-minor:#2a78d6; --sev-unknown:#8a8985;
  --shadow:0 1px 2px rgba(0,30,80,.06),0 6px 20px rgba(0,30,80,.08);
  --glow:none; --vortex1:#c9d8f2; --vortex2:#d9d2f0; --ring:rgba(0,59,111,.05);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;padding:0}
body{background:radial-gradient(ellipse 90% 60% at 50% -10%,var(--vortex1) 0%,transparent 60%),radial-gradient(circle at 85% 105%,var(--vortex2) 0%,transparent 45%),var(--bg);background-attachment:fixed;color:var(--text);font:15px/1.45 "Exo 2",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
body::before{content:"";position:fixed;inset:-20vh -20vw;pointer-events:none;z-index:-1;background:repeating-radial-gradient(circle at 50% 40%,transparent 0 54px,var(--ring) 54px 56px);opacity:.9;mask-image:radial-gradient(circle at 50% 40%,#000 0%,transparent 75%);-webkit-mask-image:radial-gradient(circle at 50% 40%,#000 0%,transparent 75%)}
a{color:var(--accent)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,.now .temp,.tile .v,.day .hl{font-family:"Audiowide","Exo 2",sans-serif;font-weight:400}
.wrap{max-width:1100px;margin:0 auto;padding:16px 16px 48px}
header.top{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-end;justify-content:space-between;margin-bottom:14px;position:relative}
.brand{display:flex;align-items:center;gap:14px}
.brand h1{margin:0;font-size:26px;letter-spacing:.06em;text-transform:uppercase;color:var(--amber2);text-shadow:var(--glow)}
[data-theme="light"] .brand h1{color:var(--tardis)}
.brand .eyebrow{font-size:11px;letter-spacing:.32em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.brand .loc{color:var(--text2);font-size:14px;margin-top:3px}
.brand .loc b{color:var(--text);font-weight:600}
/* CSS police box */
.box{position:relative;width:44px;height:58px;flex:none;filter:drop-shadow(0 6px 10px rgba(0,0,0,.45))}
.box .lamp{position:absolute;left:50%;top:0;width:8px;height:8px;margin-left:-4px;border-radius:50%;background:var(--amber2);box-shadow:0 0 10px 3px rgba(245,184,61,.75);animation:lamp 2.4s ease-in-out infinite}
.box .roof{position:absolute;left:5px;right:5px;top:8px;height:5px;background:#0d2f57;border-radius:2px 2px 0 0}
.box .sign{position:absolute;left:2px;right:2px;top:13px;height:7px;background:#0a2549;border-radius:1px}
.box .body{position:absolute;left:3px;right:3px;top:20px;bottom:0;background:linear-gradient(180deg,#1f5aa3,#0d3d78);border-radius:2px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.box .body i{position:absolute;width:11px;height:10px;background:linear-gradient(180deg,#e9f3ff,#bcd6f7);opacity:.9;box-shadow:inset 0 0 0 1px #0d3d78,inset 5px 0 0 -4px #0d3d78,inset 0 5px 0 -4px #0d3d78}
.box .body i:nth-child(1){left:5px;top:4px}.box .body i:nth-child(2){right:5px;top:4px}
.box .body b{position:absolute;left:5px;width:11px;height:8px;background:#0a2f5e;border-radius:1px}
.box .body b:nth-child(3){top:18px}.box .body b:nth-child(4){top:18px;left:auto;right:5px}
@keyframes lamp{0%,100%{opacity:.55;box-shadow:0 0 6px 1px rgba(245,184,61,.4)}50%{opacity:1;box-shadow:0 0 14px 5px rgba(245,184,61,.85)}}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.controls input[type=text]{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:220px;color:var(--text)}
.controls input[type=text]::placeholder{color:var(--muted)}
.controls input[type=text]:focus{outline:2px solid var(--accent);outline-offset:1px}
.btn{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 11px;font-size:14px;line-height:1.2;color:var(--text)}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:7px 10px;font-size:14px;color:var(--text2)}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink)}
.status{font-size:13px;color:var(--muted)}
.banner{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--sev-severe);border-radius:10px;padding:10px 14px;margin-bottom:14px;box-shadow:var(--shadow)}
.banner b{font-weight:600}
.banner .chip{font-size:13px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);background:var(--surface2)}
.banner button{margin-left:auto}
.card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;box-shadow:var(--shadow);overflow:hidden}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;background:none;border:0;padding:0;margin:0 0 6px;text-align:left;color:inherit;cursor:pointer;font:inherit}
.card-head h2{margin:0}
.card-head .caret{color:var(--muted);font-size:13px;transition:transform .15s ease;flex:none}
.card-head[aria-expanded="false"] .caret{transform:rotate(-90deg)}
.card-head:hover .caret,.card-head:focus-visible .caret{color:var(--accent)}
.card.closed{padding-bottom:13px}
.card.closed .card-head{margin-bottom:0}
.card::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:linear-gradient(90deg,transparent,var(--accent) 30%,var(--accent) 70%,transparent);opacity:.7}
.now{display:grid;grid-template-columns:minmax(220px,1.1fr) 2fr;gap:18px;margin-bottom:14px}
@media(max-width:760px){.now{grid-template-columns:1fr}}
.now .big{display:flex;align-items:center;gap:14px}
.now .big img{width:72px;height:72px;border-radius:12px;background:var(--surface2);box-shadow:0 0 0 1px var(--line)}
.now .temp{font-size:58px;letter-spacing:-.01em;line-height:1;color:var(--amber2);text-shadow:var(--glow)}
[data-theme="light"] .now .temp{color:var(--tardis)}
.now .cond{font-size:16px;color:var(--text2);margin-top:6px}
.now .feels{font-size:14px;color:var(--muted);margin-top:4px}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px 14px}
.kv>div{padding:8px 10px;background:var(--surface2);border-radius:8px;border:1px solid var(--line)}
.kv .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.14em}
.kv .v{font-size:17px;font-weight:600;margin-top:2px}
.kv .v small{display:block;font-size:12px;font-weight:400;color:var(--text2)}
.compass{display:inline-block;width:18px;height:18px;vertical-align:-3px;margin-right:4px}
/* roundel tabs */
.tabs{display:flex;flex-wrap:wrap;gap:6px;padding:4px 0 12px}
.tabs button{white-space:nowrap;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-size:14px;color:var(--text2);box-shadow:inset 0 0 0 3px var(--surface),inset 0 0 0 4px var(--line)}
.tabs button:hover{color:var(--accent);border-color:var(--accent)}
.tabs button[aria-selected=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);box-shadow:inset 0 0 0 3px var(--accent),inset 0 0 0 4px var(--accent-ink),var(--glow)}
.tabs.sub{padding:0 0 4px;margin-top:-4px}
.tabs.sub button{font-size:13px;padding:6px 12px}
.tabs .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-left:6px;vertical-align:1px;background:var(--sev-severe)}
.tabs button[aria-selected=true] .dot{background:var(--accent-ink)}
.view{display:grid;gap:14px}
.view>*,.grid2>*,.now>*{min-width:0}
.view h2{margin:0 0 6px;font-size:16px;letter-spacing:.08em;text-transform:uppercase;color:var(--amber2)}
[data-theme="light"] .view h2{color:var(--tardis)}
.view h3{margin:0 0 8px;font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.14em}
.view p.lede{margin:0 0 10px;color:var(--text2)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:1024px){.grid2{grid-template-columns:1fr}}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.tile .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.14em}
.tile .v{font-size:22px;letter-spacing:0;margin-top:4px}
.tile .s{font-size:12px;color:var(--text2);margin-top:2px}
.tile.flag{border-left:4px solid var(--sev-severe)}
.strip{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(66px,1fr);gap:6px;overflow-x:auto;padding-bottom:4px}
.strip .h{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:8px 6px;text-align:center;font-size:13px}
.strip .h.night{background:color-mix(in srgb,var(--surface2),#000 25%)}
[data-theme="light"] .strip .h.night{background:color-mix(in srgb,var(--surface2),var(--tardis) 8%)}
.strip .h .t{color:var(--muted);font-size:12px}
.strip .h img{width:40px;height:40px;border-radius:8px;margin:4px 0}
.strip .h .emo{font-size:28px;line-height:40px;height:40px;margin:4px 0}
.now .bigemo{width:72px;height:72px;border-radius:12px;background:var(--surface2);box-shadow:0 0 0 1px var(--line);font-size:44px;line-height:72px;text-align:center}
.strip .h .tp{font-weight:700;font-size:16px}
.strip .h .pp{color:var(--s-blue);font-size:12px}
.strip .h .wd{color:var(--text2);font-size:12px}
.chartwrap{overflow-x:auto}
.chart{min-width:440px;width:100%;display:block}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--text2);margin-bottom:6px}
.legend span i{display:inline-block;width:12px;height:3px;border-radius:2px;vertical-align:3px;margin-right:6px}
.legend span i.bar{height:10px;width:10px;border-radius:3px;vertical-align:-1px}
.tip{position:fixed;z-index:20;pointer-events:none;background:var(--amber);color:#0b1c3a;border-radius:8px;padding:8px 10px;font-size:13px;line-height:1.35;box-shadow:0 8px 24px rgba(0,0,0,.4);max-width:260px}
.tip b{font-weight:700}
.tip .r{display:flex;justify-content:space-between;gap:14px}
.tip .r i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px;vertical-align:0}
.words{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;font-size:13px}
.words>div{background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:6px 9px}
.words div b{display:block;font-weight:600;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.1em}
.alert{border-left:5px solid var(--sev-unknown)}
.alert.Extreme{border-left-color:var(--sev-extreme)}.alert.Severe{border-left-color:var(--sev-severe)}.alert.Moderate{border-left-color:var(--sev-moderate)}.alert.Minor{border-left-color:var(--sev-minor)}
.alert h4{margin:0 0 4px;font-size:16px}
.alert .meta{font-size:13px;color:var(--text2);margin-bottom:8px}
.alert details{font-size:14px}.alert summary{cursor:pointer;color:var(--accent)}
.alert pre{white-space:pre-wrap;font:inherit;margin:8px 0 0;color:var(--text2)}
table.data{border-collapse:collapse;width:100%;font-size:13px;min-width:900px}
table.data th,table.data td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
table.data th:first-child,table.data td:first-child{text-align:left}
table.data th{color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.1em;position:sticky;top:0;background:var(--surface)}
table.data tr.night td{background:var(--night)}
.empty{color:var(--muted);font-style:italic}
.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.day{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:12px 12px 10px;display:flex;flex-direction:column;gap:4px}
.day .dn{font-weight:600}.day .dn small{font-weight:400;color:var(--muted);margin-left:6px}
.day .ic{display:flex;align-items:center;gap:10px;margin:4px 0}
.day .ic img{width:48px;height:48px;border-radius:8px}.day .ic .emo{font-size:36px;line-height:48px;width:48px;text-align:center}
.day .hl{font-size:19px}.day .hl small{font-family:"Exo 2",sans-serif;font-weight:400;color:var(--muted);font-size:14px}
.day .tx{font-size:13px;color:var(--text2);min-height:2.6em}
.day .mt{font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 10px}
.day details{font-size:13px;margin-top:4px}.day summary{cursor:pointer;color:var(--accent)}.day details p{margin:6px 0 0;color:var(--text2)}
.day .src{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.14em;margin-top:auto;padding-top:6px}
.skymap{height:440px}
.pips{display:inline-flex;gap:2px;vertical-align:2px;margin-left:4px}
.pips i{width:9px;height:9px;border-radius:50%;border:1px solid var(--line);background:transparent;display:inline-block}
.pips i.on{background:var(--s-yellow);border-color:var(--s-yellow)}
.pips[data-v="4"] i.on,.pips[data-v="5"] i.on{background:var(--s-red);border-color:var(--s-red)}
.pips[data-v="1"] i.on,.pips[data-v="2"] i.on{background:var(--s-aqua);border-color:var(--s-aqua)}
.pips.good[data-v="4"] i.on,.pips.good[data-v="5"] i.on{background:var(--s-aqua);border-color:var(--s-aqua)}
.pips.good[data-v="1"] i.on,.pips.good[data-v="2"] i.on{background:var(--s-red);border-color:var(--s-red)}
.tiles.health{grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:7px}
@media(max-width:640px){.tiles.health{grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}.tiles.health .tile{padding:6px 8px}.tiles.health .v{font-size:14px!important}.tiles.health .s{font-size:10px}.tiles.health .k{font-size:9px;letter-spacing:.05em}}
.tiles.health .tile{padding:7px 9px}
.tiles.health .k{font-size:10px;letter-spacing:.08em}
.tiles.health .v{font-size:15px!important;margin-top:1px;display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.tiles.health .pips i{width:7px;height:7px}
.health-legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:var(--text2);margin:0 0 12px}
.health-legend .pips{margin:0 2px 0 0}
.tiles.health .s{font-size:11px;line-height:1.25;margin-top:1px}
.health-out td{vertical-align:top}
.learn{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.learn-item{display:block;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--text);text-decoration:none}
.learn-item:hover{border-color:var(--accent)}
.learn-item .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.14em}
.learn-item .v{font-weight:600;margin-top:3px}
.learn-item .he{font-size:14px;color:var(--text2);margin-top:2px}
.learn-item .s{font-size:12px;color:var(--text2);margin-top:6px}
.learn-item.daf{border-left:4px solid var(--accent)}
.learn-item.daf .v{font-family:"Audiowide","Exo 2",sans-serif;font-weight:400;font-size:18px;color:var(--amber2)}
[data-theme="light"] .learn-item.daf .v{color:var(--tardis)}
.apod img{width:100%;max-width:1000px;border-radius:10px;border:1px solid var(--line);display:block}
.apod-video{position:relative;padding-top:56.25%;max-width:1000px}
.apod-video iframe{position:absolute;inset:0;width:100%;height:100%;border:0;border-radius:10px}
.satmark{background:none;border:0;white-space:nowrap;font-size:16px;line-height:24px}
.satmark i{font-style:normal;font-size:11px;font-weight:700;color:#fff;background:rgba(0,0,0,.55);padding:1px 5px;border-radius:4px;margin-left:2px;vertical-align:3px}
table.data.narrow{min-width:640px}
.map{height:560px;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--surface2)}
@media(max-width:760px){.map{height:420px}}
.mapctl{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-bottom:10px}
.pills{display:flex;flex-wrap:wrap;gap:4px}
.pills button{border:1px solid var(--line);background:var(--surface2);border-radius:999px;padding:5px 11px;font-size:13px;color:var(--text2)}
.pills button:hover{border-color:var(--accent);color:var(--accent)}
.pills button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.timectl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px;font-size:13px;color:var(--text2)}
.timectl input[type=range]{flex:1;min-width:160px;max-width:520px;accent-color:var(--accent)}
.timectl .ts{font-weight:600;color:var(--text);min-width:150px}
input[type=range],input[type=checkbox]{accent-color:var(--accent)}
.maplegend{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start;margin-top:10px}
.maplegend img{background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px;max-width:100%}
.legend-details summary{cursor:pointer;font-size:13px;color:var(--accent)}
.legend-details img{margin-top:6px;max-height:260px;overflow:auto}
.legend-details[open]{max-height:300px;overflow:auto}
.leaflet-container{font:inherit}
.leaflet-popup-content{font-size:13px;line-height:1.4;margin:10px 12px}
.leaflet-popup-content .btn{margin-top:8px}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--surface);color:var(--text)}
.leaflet-bar a{background:var(--surface);color:var(--text);border-color:var(--line)}
label.chk{display:inline-flex;gap:6px;align-items:center;font-size:13px;color:var(--text2)}
.note{font-size:13px;color:var(--muted)}
.err{background:var(--surface);border:1px solid var(--sev-severe);border-radius:10px;padding:14px;color:var(--text)}
.radar img{width:100%;max-width:600px;border-radius:10px;border:1px solid var(--line);display:block}
footer{margin-top:28px;font-size:13px;color:var(--muted);line-height:1.6}
.skel{height:120px;border-radius:12px;border:1px dashed var(--line);display:flex;align-items:center;justify-content:center;color:var(--muted);letter-spacing:.3em;text-transform:uppercase;font-size:12px;animation:mat 1.6s ease-in-out infinite}
@keyframes mat{0%,100%{opacity:.35}50%{opacity:1}}
.sr{position:absolute;left:-9999px}
</style>
</head>
<body>
<div class="wrap">
  <header class="top" data-container="Header">
    <div class="brand">
      <div class="box" aria-hidden="true"><span class="lamp"></span><span class="roof"></span><span class="sign"></span><span class="body"><i></i><i></i><b></b><b></b></span></div>
      <div>
        <div class="eyebrow">Weather console</div>
        <h1>Weather Now</h1>
        <div class="loc" id="locLine">Materialising…</div>
      </div>
    </div>
    <div class="controls">
      <form id="searchForm" style="display:flex;gap:6px">
        <input type="text" id="q" placeholder="City, postal code, or lat,lon · US, Canada, Mexico, Brazil" aria-label="Search location">
        <button class="btn" type="submit">Go</button>
      </form>
      <button class="btn" id="geoBtn" title="Use my location">📍 My location</button>
      <div class="seg" role="group" aria-label="Units">
        <button id="uUS" aria-pressed="true">°F mph</button><button id="uSI" aria-pressed="false">°C km/h</button>
      </div>
      <button class="btn" id="themeBtn" title="Vortex / daylight">◐</button>
      <button class="btn" id="refreshBtn" title="Rematerialise (refresh)">↻</button>
    </div>
  </header>

  <div id="banner"></div>
  <div id="now"></div>
  <nav class="tabs" id="tabs" role="tablist" aria-label="Weather views"></nav>
  <div class="view" id="view" role="tabpanel"></div>

  <div id="apod" style="margin-top:14px"></div>
  <div id="learn" style="margin-top:14px"></div>
  <footer data-container="Footer" id="foot"></footer>
</div>
<div class="tip" id="tip" hidden></div>

<script>
'use strict';
const API = 'https://api.weather.gov';
const BUILD = '2026-09-25.1';
const HOUR = 3600e3;
const $ = s => document.querySelector(s);
function el(tag, attrs = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null) continue;
    if (typeof v === 'boolean') { if (k.startsWith('aria-')) e.setAttribute(k, String(v)); else if (v) e.setAttribute(k, ''); continue; }
    if (k === 'class') e.className = v;
    else if (k === 'html') e.innerHTML = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v);
  }
  for (const k of kids.flat(Infinity)) { if (k == null || k === false) continue; e.append(k.nodeType ? k : document.createTextNode(k)); }
  return e;
}
const svgNS = 'http://www.w3.org/2000/svg';
function sv(tag, attrs = {}, ...kids) {
  const e = document.createElementNS(svgNS, tag);
  for (const [k, v] of Object.entries(attrs)) if (v != null) e.setAttribute(k, v);
  for (const k of kids.flat(Infinity)) if (k != null) e.append(k.nodeType ? k : document.createTextNode(k));
  return e;
}

// ---------- state ----------
const VIEWS = [
  ['overview', 'Overview'], ['map', 'Map'], ['tenday', '10-day'], ['temperature', 'Temperature'], ['rain', 'Rain'], ['clouds', 'Clouds & sky'], ['wind', 'Wind'],
  ['storms', 'Storms & lightning'], ['snow', 'Snow & ice'], ['fire', 'Fire weather'], ['alerts', 'Alerts'], ['table', 'Data table']
];
const state = {
  lat: null, lon: null, label: null,
  units: localStorage.getItem('wx.units') || 'us',
  view: (location.hash.slice(1) || 'overview'),
  data: null, loading: false, error: null, updated: null, geoNote: null
};
if (!VIEWS.some(v => v[0] === state.view)) state.view = 'overview';

// ---------- theme ----------
function applyTheme(t) { document.documentElement.setAttribute('data-theme', t); localStorage.setItem('wx.theme2', t); }
applyTheme(localStorage.getItem('wx.theme2') || 'dark');
$('#themeBtn').onclick = () => { applyTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'); render(); };

// ---------- units ----------
const toF = c => c * 9 / 5 + 32, toMph = k => k / 1.609344, toIn = mm => mm / 25.4, toFt = m => m * 3.28084, toMi = m => m / 1609.344;
const US = () => state.units === 'us';
const fmtT = c => c == null ? '–' : `${Math.round(US() ? toF(c) : c)}°`;
const fmtTu = c => c == null ? '–' : `${Math.round(US() ? toF(c) : c)}°${US() ? 'F' : 'C'}`;
const fmtSpd = k => k == null ? '–' : `${Math.round(US() ? toMph(k) : k)} ${US() ? 'mph' : 'km/h'}`;
const fmtPct = p => p == null ? '–' : `${Math.round(p)}%`;
const fmtLen = mm => mm == null ? '–' : US() ? `${(toIn(mm)).toFixed(mm > 0 && toIn(mm) < 0.01 ? 3 : 2)} in` : `${mm.toFixed(1)} mm`;
const fmtAlt = m => m == null ? '–' : US() ? `${Math.round(toFt(m)).toLocaleString()} ft` : `${Math.round(m).toLocaleString()} m`;
const fmtDist = m => m == null ? '–' : US() ? `${(toMi(m)).toFixed(1)} mi` : `${(m / 1000).toFixed(1)} km`;
const fmtPress = pa => pa == null ? '–' : US() ? `${(pa / 3386.389).toFixed(2)} inHg` : `${Math.round(pa / 100)} hPa`;
const valT = c => c == null ? null : US() ? toF(c) : c;
const valSpd = k => k == null ? null : US() ? toMph(k) : k;
const valLen = mm => mm == null ? null : US() ? toIn(mm) : mm;
const valAlt = m => m == null ? null : US() ? toFt(m) : m;
const DIRS = ['N', 'NNE', 'NE', 'ENE', 'E', 'ESE', 'SE', 'SSE', 'S', 'SSW', 'SW', 'WSW', 'W', 'WNW', 'NW', 'NNW'];
const dirName = d => d == null ? '–' : DIRS[Math.round(d / 22.5) % 16];

// ---------- time ----------
function fmtHour(t, tz) { return new Intl.DateTimeFormat('en-US', { hour: 'numeric', timeZone: tz }).format(new Date(t)).replace(' AM', 'a').replace(' PM', 'p'); }
function fmtTime(t, tz) { return new Intl.DateTimeFormat('en-US', { hour: 'numeric', minute: '2-digit', timeZone: tz }).format(new Date(t)); }
function fmtDT(t, tz) { return new Intl.DateTimeFormat('en-US', { weekday: 'short', hour: 'numeric', minute: '2-digit', timeZone: tz }).format(new Date(t)); }

// Sunrise / sunset (NOAA-style, adapted from the well-known suncalc formulas)
const rad = Math.PI / 180, dayMs = 864e5, J1970 = 2440588, J2000 = 2451545, ecl = rad * 23.4397;
function sunTimes(t, lat, lng) {
  const toDays = ms => ms / dayMs - 0.5 + J1970 - J2000, fromJ = j => (j + 0.5 - J1970) * dayMs;
  const lw = rad * -lng, phi = rad * lat, d = toDays(t), n = Math.round(d - 0.0009 - lw / (2 * Math.PI));
  const ds = 0.0009 + lw / (2 * Math.PI) + n, M = rad * (357.5291 + 0.98560028 * ds);
  const L = M + rad * (1.9148 * Math.sin(M) + 0.02 * Math.sin(2 * M) + 0.0003 * Math.sin(3 * M)) + rad * 102.9372 + Math.PI;
  const dec = Math.asin(Math.sin(ecl) * Math.sin(L)), Jnoon = J2000 + ds + 0.0053 * Math.sin(M) - 0.0069 * Math.sin(2 * L);
  const w = Math.acos((Math.sin(-0.833 * rad) - Math.sin(phi) * Math.sin(dec)) / (Math.cos(phi) * Math.cos(dec)));
  if (isNaN(w)) return null;
  const Jset = J2000 + (0.0009 + (w + lw) / (2 * Math.PI) + n) + 0.0053 * Math.sin(M) - 0.0069 * Math.sin(2 * L);
  return { sunrise: fromJ(Jnoon - (Jset - Jnoon)), sunset: fromJ(Jset) };
}
function isNight(t, lat, lon) { const s = sunTimes(t, lat, lon); if (!s) return false; return t < s.sunrise || t >= s.sunset; }

// ---------- NWS fetch ----------
async function nws(url) {
  const r = await fetch(url, { headers: { Accept: 'application/geo+json' } });
  if (!r.ok) { let msg = `${r.status}`; try { const j = await r.json(); msg = j.detail || j.title || msg; } catch (e) { } throw new Error(msg); }
  return r.json();
}
function parseValid(vt) {
  const [s, d] = vt.split('/');
  const start = Date.parse(s);
  const m = /P(?:(\d+)D)?(?:T(?:(\d+)H)?(?:(\d+)M)?)?/.exec(d || 'PT1H');
  const hrs = (+(m[1] || 0)) * 24 + (+(m[2] || 0)) + (+(m[3] || 0)) / 60;
  return { start, end: start + Math.max(hrs, 1) * HOUR, hours: Math.max(hrs, 1) };
}
function layer(grid, name) {
  const L = grid[name];
  if (!L || !Array.isArray(L.values) || !L.values.length) return null;
  const segs = L.values.map(v => ({ ...parseValid(v.validTime), value: v.value }));
  return { uom: L.uom, segs, seg(t) { return segs.find(s => t >= s.start && t < s.end) || null; }, at(t) { const s = this.seg(t); return s ? s.value : null; } };
}

const HAZ = { AF: 'Ashfall', AS: 'Air stagnation', BS: 'Blowing snow', BW: 'Brisk wind', BZ: 'Blizzard', CF: 'Coastal flood', DS: 'Dust storm', DU: 'Blowing dust', EC: 'Extreme cold', EH: 'Excessive heat', EW: 'Extreme wind', FA: 'Areal flood', FF: 'Flash flood', FG: 'Dense fog', FL: 'Flood', FR: 'Frost', FW: 'Fire weather', FZ: 'Freeze', GL: 'Gale', HF: 'Hurricane-force wind', HI: 'Inland hurricane', HS: 'Heavy snow', HT: 'Heat', HU: 'Hurricane', HW: 'High wind', HY: 'Hydrologic', HZ: 'Hard freeze', IP: 'Sleet', IS: 'Ice storm', LB: 'Lake-effect snow & blowing snow', LE: 'Lake-effect snow', LO: 'Low water', LS: 'Lakeshore flood', LW: 'Lake wind', MA: 'Marine', RB: 'Small craft (rough bar)', RP: 'Rip current', SB: 'Snow & blowing snow', SC: 'Small craft', SE: 'Hazardous seas', SI: 'Small craft (winds)', SM: 'Dense smoke', SN: 'Snow', SR: 'Storm', SU: 'High surf', SV: 'Severe thunderstorm', SW: 'Small craft (hazardous seas)', TI: 'Inland tropical storm', TO: 'Tornado', TR: 'Tropical storm', TS: 'Tsunami', TY: 'Typhoon', UP: 'Ice accretion', WC: 'Wind chill', WI: 'Wind', WS: 'Winter storm', WW: 'Winter weather', ZF: 'Freezing fog', ZR: 'Freezing rain' };
const SIG = { W: 'Warning', A: 'Watch', Y: 'Advisory', S: 'Statement' };
const COV = { slight_chance: 'Slight chance of', chance: 'Chance of', likely: 'Likely', definite: '', areas: 'Areas of', patchy: 'Patchy', isolated: 'Isolated', scattered: 'Scattered', numerous: 'Numerous', occasional: 'Occasional', periods_of: 'Periods of', frequent: 'Frequent', intermittent: 'Intermittent', brief: 'Brief' };
const INT = { very_light: 'very light', light: 'light', moderate: 'moderate', heavy: 'heavy' };
function weatherWords(arr) {
  if (!Array.isArray(arr)) return '';
  const parts = arr.filter(w => w && w.weather).map(w => [COV[w.coverage] ?? (w.coverage || ''), INT[w.intensity] ?? '', w.weather.replace(/_/g, ' ')].filter(Boolean).join(' '));
  return parts.map(p => p.charAt(0).toUpperCase() + p.slice(1)).join('; ');
}
const LAL = ['', 'No thunderstorms', 'Isolated storms', 'Widely scattered', 'Scattered', 'Numerous', 'Dry lightning'];
const HEATRISK = ['Little to none', 'Minor', 'Moderate', 'Major', 'Extreme'];
function skyWords(p) { if (p == null) return '–'; if (p < 12) return 'Clear'; if (p < 38) return 'Mostly clear'; if (p < 63) return 'Partly cloudy'; if (p < 88) return 'Mostly cloudy'; return 'Overcast'; }
function beaufort(kmh) { if (kmh == null) return ''; const b = [[1, 'Calm'], [5, 'Light air'], [11, 'Light breeze'], [19, 'Gentle breeze'], [28, 'Moderate breeze'], [38, 'Fresh breeze'], [49, 'Strong breeze'], [61, 'Near gale'], [74, 'Gale'], [88, 'Strong gale'], [102, 'Storm'], [117, 'Violent storm'], [1e9, 'Hurricane force']]; return b.find(x => kmh < x[0])[1]; }

// ---------- load & assemble ----------
const DEFAULT_LOC = { lat: 40.7141, lon: -74.0744, label: 'Jersey City, NJ 07304' };
async function load(lat, lon, label, remember) {
  state.loading = true; state.error = null; state.lat = lat; state.lon = lon; state.label = label || null; render();
  try {
    let pts = null;
    try { pts = await nws(`${API}/points/${lat.toFixed(4)},${lon.toFixed(4)}`); } catch (e) { if (!/404|Unable to provide data/i.test(e.message)) throw e; }
    if (!pts) state.data = await loadIntl(lat, lon);
    else {
    const p = pts.properties;
    const [grid, hourly, stations, alerts, dailyNws, om, omH, aq] = await Promise.all([
      nws(p.forecastGridData),
      nws(p.forecastHourly).catch(() => null),
      nws(p.observationStations).catch(() => null),
      nws(`${API}/alerts/active?point=${lat.toFixed(4)},${lon.toFixed(4)}`).catch(() => ({ features: [] })),
      nws(p.forecast).catch(() => null),
      fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat.toFixed(4)}&longitude=${lon.toFixed(4)}&daily=weather_code,temperature_2m_max,temperature_2m_min,apparent_temperature_max,apparent_temperature_min,precipitation_sum,snowfall_sum,precipitation_probability_max,wind_speed_10m_max,wind_gusts_10m_max,wind_direction_10m_dominant,uv_index_max,sunrise,sunset&forecast_days=10&timezone=${encodeURIComponent(p.timeZone || 'auto')}`).then(r => r.ok ? r.json() : null).catch(() => null),
      fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat.toFixed(4)}&longitude=${lon.toFixed(4)}&hourly=temperature_2m,relative_humidity_2m,dew_point_2m,pressure_msl,uv_index,wind_speed_10m,precipitation,weather_code,cape&past_days=2&forecast_days=7&timeformat=unixtime&timezone=UTC`).then(r => r.ok ? r.json() : null).catch(() => null),
      fetch(`https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${lat.toFixed(4)}&longitude=${lon.toFixed(4)}&hourly=us_aqi,pm2_5,pm10,ozone,dust,alder_pollen,birch_pollen,grass_pollen,mugwort_pollen,olive_pollen,ragweed_pollen&past_days=2&forecast_days=5&timeformat=unixtime&timezone=UTC`).then(r => r.ok ? r.json() : null).catch(() => null)
    ]);
    let obs = null;
    if (stations) {
      for (const f of stations.features.slice(0, 4)) {
        try {
          const o = await nws(`${API}/stations/${f.properties.stationIdentifier}/observations/latest`);
          if (o.properties && o.properties.temperature && o.properties.temperature.value != null) { obs = o.properties; obs.stationName = f.properties.name; obs.stationId = f.properties.stationIdentifier; break; }
        } catch (e) { }
      }
    }
    state.data = assemble({ pts: p, grid: grid.properties, hourly: hourly && hourly.properties, obs, alerts: alerts.features || [], lat, lon, dailyNws: dailyNws && dailyNws.properties, om, omH, aq });
    }
    state.updated = Date.now();
    loadDailyLearning(state.data);
    if (remember) localStorage.setItem('wx.loc2', JSON.stringify({ lat, lon, label: state.label }));
  } catch (e) {
    state.error = `Could not load a forecast for this point (${e.message}). The NWS covers the United States; Open-Meteo covers everywhere else.`;
  }
  state.loading = false; render();
}

const NUMERIC = ['temperature', 'apparentTemperature', 'dewpoint', 'relativeHumidity', 'heatIndex', 'windChill', 'skyCover', 'windDirection', 'windSpeed', 'windGust', 'probabilityOfPrecipitation', 'snowLevel', 'visibility', 'ceilingHeight', 'probabilityOfThunder', 'lightningActivityLevel', 'grasslandFireDangerIndex', 'redFlagThreatIndex', 'hainesIndex', 'twentyFootWindSpeed', 'twentyFootWindDirection', 'transportWindSpeed', 'transportWindDirection', 'mixingHeight', 'pressure', 'heatRisk', 'davisStabilityIndex', 'atmosphericDispersionIndex', 'lowVisibilityOccurrenceRiskIndex', 'wetBulbGlobeTemperature'];
const ACCUM = ['quantitativePrecipitation', 'snowfallAmount', 'iceAccumulation'];

function assemble({ pts, grid, hourly, obs, alerts, lat, lon, dailyNws, om, omH, aq }) {
  const tz = pts.timeZone || Intl.DateTimeFormat().resolvedOptions().timeZone;
  const now = Date.now();
  const h0 = Math.floor(now / HOUR) * HOUR;
  const hours = Array.from({ length: 13 }, (_, i) => h0 + i * HOUR);
  const layers = {};
  for (const n of [...NUMERIC, ...ACCUM, 'hazards', 'weather']) layers[n] = layer(grid, n);
  const periods = {};
  if (hourly && hourly.periods) for (const per of hourly.periods) periods[Date.parse(per.startTime)] = per;
  const rows = hours.map((t, i) => {
    const r = { t, i, night: isNight(t + HOUR / 2, lat, lon), period: periods[t] || null };
    for (const n of NUMERIC) r[n] = layers[n] ? layers[n].at(t) : null;
    for (const n of ACCUM) { const s = layers[n] && layers[n].seg(t); r[n] = s && s.value != null ? s.value / s.hours : null; r[n + 'Raw'] = s ? s.value : null; }
    r.hazards = layers.hazards ? (layers.hazards.at(t) || []) : [];
    r.weather = layers.weather ? (layers.weather.at(t) || []) : [];
    r.weatherText = weatherWords(r.weather);
    // fill gaps from the hourly product where the grid is silent
    if (r.period) {
      if (r.temperature == null && r.period.temperature != null) r.temperature = r.period.temperatureUnit === 'F' ? (r.period.temperature - 32) * 5 / 9 : r.period.temperature;
      if (r.probabilityOfPrecipitation == null && r.period.probabilityOfPrecipitation) r.probabilityOfPrecipitation = r.period.probabilityOfPrecipitation.value;
      if (r.relativeHumidity == null && r.period.relativeHumidity) r.relativeHumidity = r.period.relativeHumidity.value;
      if (r.dewpoint == null && r.period.dewpoint) r.dewpoint = r.period.dewpoint.value;
    }
    r.cond = r.period ? r.period.shortForecast : (r.weatherText || skyWords(r.skyCover));
    r.icon = r.period ? r.period.icon.replace(/size=\w+/, 'size=medium') : null;
    r.thunder = /thunder/i.test(r.cond) || r.weather.some(w => w && /thunder/.test(w.weather || ''));
    return r;
  });
  const sun = sunTimes(now, lat, lon);
  const alertsSorted = alerts.map(f => f.properties).sort((a, b) => sevRank(a.severity) - sevRank(b.severity));
  return { tz, hours, rows, obs, alerts: alertsSorted, pts, grid, sun, radar: pts.radarStation, layers, daily: buildDaily(dailyNws, om, tz), health: computeHealth(omH, aq, tz, lat) };
}
const SEVS = ['Extreme', 'Severe', 'Moderate', 'Minor', 'Unknown'];
const sevRank = s => { const i = SEVS.indexOf(s); return i < 0 ? 9 : i; };
const alertMatches = (a, re) => re.test(a.event + ' ' + (a.headline || ''));
const RE = { storm: /tornado|thunderstorm|severe|lightning|hurricane|tropical|special weather/i, fire: /fire|red flag|smoke/i, snow: /winter|snow|ice|blizzard|freez|frost|cold|wind chill|sleet/i, rain: /flood|rain|hydrologic/i, wind: /wind|gale|storm warning|small craft/i, heat: /heat/i, clouds: /fog|smoke|air quality|dense/i };

// ---------- chart ----------
function chart({ rows, tz, series, yFmt, yMin, yMax, height = 250, arrows, ticks = 4, integer = false, ariaLabel, xLabel, tipLabel, dots = true }) {
  const W = 760, H = height, pad = { l: 52, r: 14, t: 14, b: arrows ? 56 : 34 };
  const n = rows.length, iw = W - pad.l - pad.r, ih = H - pad.t - pad.b, band = iw / n;
  const all = series.flatMap(s => s.values).filter(v => v != null && isFinite(v));
  let lo = yMin != null ? yMin : Math.min(...all), hi = yMax != null ? yMax : Math.max(...all);
  if (!all.length) { lo = yMin ?? 0; hi = yMax ?? 1; }
  if (hi - lo < 1e-9) { hi = lo + 1; lo = yMin != null ? lo : lo - 1; }
  const span0 = hi - lo;
  if (yMax == null) hi += span0 * 0.12;
  if (yMin == null) lo -= span0 * 0.12;
  const y = v => pad.t + ih - (v - lo) / (hi - lo) * ih;
  const xc = i => pad.l + band * (i + 0.5);
  const svg = sv('svg', { class: 'chart', viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': ariaLabel || series.map(s => s.name).join(', ') });
  // night shading
  rows.forEach((r, i) => { if (r.night) svg.append(sv('rect', { x: pad.l + band * i, y: pad.t, width: band, height: ih, fill: 'var(--night)' })); });
  // grid + y labels
  for (let k = 0; k <= ticks; k++) {
    const v = lo + (hi - lo) * k / ticks, yy = y(v);
    svg.append(sv('line', { x1: pad.l, x2: W - pad.r, y1: yy, y2: yy, stroke: 'var(--grid)', 'stroke-width': 1 }));
    svg.append(sv('text', { x: pad.l - 8, y: yy + 4, 'text-anchor': 'end', 'font-size': 12, fill: 'var(--muted)' }, yFmt(integer ? Math.round(v) : v)));
  }
  if (lo < 0 && hi > 0) svg.append(sv('line', { x1: pad.l, x2: W - pad.r, y1: y(0), y2: y(0), stroke: 'var(--muted)', 'stroke-width': 1 }));
  // x labels
  rows.forEach((r, i) => svg.append(sv('text', { x: xc(i), y: H - (arrows ? 30 : 10), 'text-anchor': 'middle', 'font-size': 12, fill: i === 0 ? 'var(--text)' : 'var(--muted)', 'font-weight': i === 0 ? 600 : 400 }, xLabel ? xLabel(r, i) : i === 0 ? 'Now' : fmtHour(r.t, tz))));
  // series
  const bars = series.filter(s => s.kind === 'bar'), nb = bars.length;
  series.forEach(s => {
    if (s.kind === 'bar') {
      const bi = bars.indexOf(s), bw = (band * 0.66 - (nb - 1) * 2) / nb;
      s.values.forEach((v, i) => {
        if (v == null) return;
        const x0 = xc(i) - band * 0.33 + bi * (bw + 2), y0 = y(Math.max(v, 0)), hgt = Math.max(0, y(Math.min(v, 0)) - y0);
        const r = Math.min(4, hgt / 2, bw / 2);
        svg.append(sv('path', { d: `M${x0},${y0 + hgt} V${y0 + r} Q${x0},${y0} ${x0 + r},${y0} H${x0 + bw - r} Q${x0 + bw},${y0} ${x0 + bw},${y0 + r} V${y0 + hgt} Z`, fill: s.color, opacity: s.opacity ?? 0.9 }));
      });
    } else {
      const pts = s.values.map((v, i) => v == null ? null : [xc(i), y(v)]);
      let d = '', open = false;

document.addEventListener('keydown', e => { if (e.target.tagName === 'INPUT') return; const i = VIEWS.findIndex(v => v[0] === state.view); if (e.key === 'ArrowRight') setView(VIEWS[(i + 1) % VIEWS.length][0]); if (e.key === 'ArrowLeft') setView(VIEWS[(i - 1 + VIEWS.length) % VIEWS.length][0]); });
setInterval(() => { if (state.lat != null && !state.loading && document.visibilityState === 'visible' && state.view !== 'map' && state.view !== 'overview') load(state.lat, state.lon, state.label); }, 10 * 60e3);

// ---------- boot ----------
loadApod();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => { });
(function boot() {
  const qs = new URLSearchParams(location.search);
  if (qs.get('lat') && qs.get('lon')) return load(+qs.get('lat'), +qs.get('lon'), qs.get('name'));
  const saved = localStorage.getItem('wx.loc2');
  if (saved) { try { const s = JSON.parse(saved); load(s.lat, s.lon, s.label); return; } catch (e) { } }
  load(DEFAULT_LOC.lat, DEFAULT_LOC.lon, DEFAULT_LOC.label);
})();
</script>
</body>
</html>
