<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weather Now</title>
<link rel="icon" href="data:,">
<meta name="description" content="Current conditions and the next 12 hours from the US National Weather Service: temperature, rain, clouds, wind, storms, lightning, snow, fire weather and alerts.">
<style>
:root{
  color-scheme:light;
  --bg:#f4f4f2; --surface:#ffffff; --surface2:#f7f7f5; --line:#e2e1dd; --text:#0b0b0b; --text2:#52514e; --muted:#8a8985;
  --accent:#2a78d6; --accent-ink:#ffffff; --grid:#ebeae6; --night:rgba(30,30,60,.07);
  --s-blue:#2a78d6; --s-orange:#eb6834; --s-aqua:#1baf7a; --s-yellow:#eda100; --s-magenta:#e87ba4; --s-green:#008300; --s-violet:#4a3aa7; --s-red:#e34948;
  --sev-extreme:#b3261e; --sev-severe:#e34948; --sev-moderate:#eda100; --sev-minor:#2a78d6; --sev-unknown:#8a8985;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 16px rgba(0,0,0,.05);
}
[data-theme="dark"]{
  color-scheme:dark;
  --bg:#111112; --surface:#1a1a19; --surface2:#222221; --line:#2d2d2b; --text:#ffffff; --text2:#c3c2b7; --muted:#8c8b84;
  --accent:#3987e5; --accent-ink:#ffffff; --grid:#272725; --night:rgba(255,255,255,.055);
  --s-blue:#3987e5; --s-orange:#d95926; --s-aqua:#199e70; --s-yellow:#c98500; --s-magenta:#d55181; --s-green:#3aa53a; --s-violet:#9085e9; --s-red:#e66767;
  --sev-extreme:#ff6b6b; --sev-severe:#e66767; --sev-moderate:#c98500; --sev-minor:#3987e5; --sev-unknown:#8c8b84;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--accent)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:1100px;margin:0 auto;padding:16px 16px 48px}
header.top{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-end;justify-content:space-between;margin-bottom:14px}
.brand h1{margin:0;font-size:22px;letter-spacing:-.01em}
.brand .loc{color:var(--text2);font-size:14px;margin-top:2px}
.brand .loc b{color:var(--text);font-weight:600}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.controls input[type=text]{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:220px}
.btn{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 11px;font-size:14px;line-height:1.2}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:7px 10px;font-size:14px}
.seg button[aria-pressed=true]{background:var(--text);color:var(--bg)}
.status{font-size:13px;color:var(--muted)}
.banner{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--sev-severe);border-radius:10px;padding:10px 14px;margin-bottom:14px;box-shadow:var(--shadow)}
.banner b{font-weight:600}
.banner .chip{font-size:13px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);background:var(--surface2)}
.banner button{margin-left:auto}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;box-shadow:var(--shadow)}
.now{display:grid;grid-template-columns:minmax(220px,1.1fr) 2fr;gap:18px;margin-bottom:14px}
@media(max-width:760px){.now{grid-template-columns:1fr}}
.now .big{display:flex;align-items:center;gap:14px}
.now .big img{width:72px;height:72px;border-radius:12px;background:var(--surface2)}
.now .temp{font-size:56px;font-weight:600;letter-spacing:-.03em;line-height:1}
.now .cond{font-size:16px;color:var(--text2);margin-top:6px}
.now .feels{font-size:14px;color:var(--muted);margin-top:4px}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px 14px}
.kv div{padding:8px 10px;background:var(--surface2);border-radius:8px}
.kv .k{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.kv .v{font-size:17px;font-weight:600;margin-top:2px}
.kv .v small{display:block;font-size:12px;font-weight:400;color:var(--text2)}
.compass{display:inline-block;width:18px;height:18px;vertical-align:-3px;margin-right:4px}
.tabs{display:flex;flex-wrap:wrap;gap:4px;padding:4px 0 10px}
.tabs button{white-space:nowrap;border:1px solid transparent;background:transparent;border-radius:999px;padding:7px 13px;font-size:14px;color:var(--text2)}
.tabs button:hover{background:var(--surface)}
.tabs button[aria-selected=true]{background:var(--text);color:var(--bg);border-color:var(--text)}
.tabs .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-left:6px;vertical-align:1px;background:var(--sev-severe)}
.view{display:grid;gap:14px}
.view>*,.grid2>*,.now>*{min-width:0}
.view h2{margin:0 0 4px;font-size:17px}
.view h3{margin:0 0 8px;font-size:14px;color:var(--text2);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.view p.lede{margin:0 0 10px;color:var(--text2)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:1024px){.grid2{grid-template-columns:1fr}}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.tile .k{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.tile .v{font-size:24px;font-weight:600;letter-spacing:-.02em;margin-top:2px}
.tile .s{font-size:12px;color:var(--text2);margin-top:2px}
.tile.flag{border-left:4px solid var(--sev-severe)}
.strip{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(66px,1fr);gap:6px;overflow-x:auto;padding-bottom:4px}
.strip .h{background:var(--surface2);border-radius:10px;padding:8px 6px;text-align:center;font-size:13px}
.strip .h.night{background:color-mix(in srgb,var(--surface2),var(--text) 6%)}
.strip .h .t{color:var(--muted);font-size:12px}
.strip .h img{width:40px;height:40px;border-radius:8px;margin:4px 0}
.strip .h .tp{font-weight:600;font-size:16px}
.strip .h .pp{color:var(--s-blue);font-size:12px}
.strip .h .wd{color:var(--text2);font-size:12px}
.chartwrap{overflow-x:auto}
.chart{min-width:440px;width:100%;display:block}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--text2);margin-bottom:6px}
.legend span i{display:inline-block;width:12px;height:3px;border-radius:2px;vertical-align:3px;margin-right:6px}
.legend span i.bar{height:10px;width:10px;border-radius:3px;vertical-align:-1px}
.tip{position:fixed;z-index:20;pointer-events:none;background:var(--text);color:var(--bg);border-radius:8px;padding:8px 10px;font-size:13px;line-height:1.35;box-shadow:var(--shadow);max-width:260px}
.tip b{font-weight:600}
.tip .r{display:flex;justify-content:space-between;gap:14px}
.tip .r i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px;vertical-align:0}
.words{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;font-size:13px}
.words div{background:var(--surface2);border-radius:8px;padding:6px 9px}
.words div b{display:block;font-weight:600;color:var(--muted);font-size:11px;text-transform:uppercase}
.alert{border-left:5px solid var(--sev-unknown);}
.alert.Extreme{border-left-color:var(--sev-extreme)}.alert.Severe{border-left-color:var(--sev-severe)}.alert.Moderate{border-left-color:var(--sev-moderate)}.alert.Minor{border-left-color:var(--sev-minor)}
.alert h4{margin:0 0 4px;font-size:16px}
.alert .meta{font-size:13px;color:var(--text2);margin-bottom:8px}
.alert details{font-size:14px}.alert summary{cursor:pointer;color:var(--accent)}
.alert pre{white-space:pre-wrap;font:inherit;margin:8px 0 0;color:var(--text2)}
table.data{border-collapse:collapse;width:100%;font-size:13px;min-width:900px}
table.data th,table.data td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
table.data th:first-child,table.data td:first-child{text-align:left}
table.data th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.03em;position:sticky;top:0;background:var(--surface)}
table.data tr.night td{background:var(--night)}
.empty{color:var(--muted);font-style:italic}
.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.day{background:var(--surface2);border-radius:10px;padding:12px 12px 10px;display:flex;flex-direction:column;gap:4px}
.day .dn{font-weight:600}.day .dn small{font-weight:400;color:var(--muted);margin-left:6px}
.day .ic{display:flex;align-items:center;gap:10px;margin:4px 0}
.day .ic img{width:48px;height:48px;border-radius:8px}.day .ic .emo{font-size:36px;line-height:48px;width:48px;text-align:center}
.day .hl{font-size:20px;font-weight:600;letter-spacing:-.01em}.day .hl small{font-weight:400;color:var(--muted);font-size:15px}
.day .tx{font-size:13px;color:var(--text2);min-height:2.6em}
.day .mt{font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 10px}
.day details{font-size:13px;margin-top:4px}.day summary{cursor:pointer;color:var(--accent)}.day details p{margin:6px 0 0;color:var(--text2)}
.day .src{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-top:auto;padding-top:6px}

.map{height:560px;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--surface2)}
@media(max-width:760px){.map{height:420px}}
.mapctl{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-bottom:10px}
.pills{display:flex;flex-wrap:wrap;gap:4px}
.pills button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:13px;color:var(--text2)}
.pills button[aria-pressed=true]{background:var(--text);color:var(--bg);border-color:var(--text)}
.timectl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px;font-size:13px;color:var(--text2)}
.timectl input[type=range]{flex:1;min-width:160px;max-width:520px}
.timectl .ts{font-weight:600;color:var(--text);min-width:150px}
.maplegend{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start;margin-top:10px}
.maplegend img{background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px;max-width:100%}
.legend-details summary{cursor:pointer;font-size:13px;color:var(--accent)}
.legend-details img{margin-top:6px;max-height:260px;overflow:auto}
.legend-details[open]{max-height:300px;overflow:auto}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--surface);color:var(--text)}
.leaflet-bar a{background:var(--surface);color:var(--text);border-color:var(--line)}
.leaflet-container{font:inherit}
.leaflet-popup-content{font-size:13px;line-height:1.4;margin:10px 12px}
.leaflet-popup-content .btn{margin-top:8px}
label.chk{display:inline-flex;gap:6px;align-items:center;font-size:13px;color:var(--text2)}

.note{font-size:13px;color:var(--muted)}
.err{background:var(--surface);border:1px solid var(--sev-severe);border-radius:10px;padding:14px;color:var(--text)}
.radar img{width:100%;max-width:600px;border-radius:10px;border:1px solid var(--line);display:block}
footer{margin-top:28px;font-size:13px;color:var(--muted);line-height:1.6}
.skel{height:120px;border-radius:12px;background:linear-gradient(90deg,var(--surface),var(--surface2),var(--surface));background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}
.sr{position:absolute;left:-9999px}
</style>
</head>
<body>
<div class="wrap">
  <header class="top" data-container="Header">
    <div class="brand">
      <h1>Weather Now</h1>
      <div class="loc" id="locLine">Locating…</div>
    </div>
    <div class="controls">
      <form id="searchForm" style="display:flex;gap:6px">
        <input type="text" id="q" placeholder="City, ZIP, or lat,lon (US only)" aria-label="Search location">
        <button class="btn" type="submit">Go</button>
      </form>
      <button class="btn" id="geoBtn" title="Use my location">📍 My location</button>
      <div class="seg" role="group" aria-label="Units">
        <button id="uUS" aria-pressed="true">°F mph</button><button id="uSI" aria-pressed="false">°C km/h</button>
      </div>
      <button class="btn" id="themeBtn" title="Toggle theme">◐</button>
      <button class="btn" id="refreshBtn" title="Refresh">↻</button>
    </div>
  </header>

  <div id="banner"></div>
  <div id="now"></div>
  <nav class="tabs" id="tabs" role="tablist" aria-label="Weather views"></nav>
  <div class="view" id="view" role="tabpanel"></div>

  <footer data-container="Footer" id="foot"></footer>
</div>
<div class="tip" id="tip" hidden></div>

<script>
'use strict';
const API = 'https://api.weather.gov';
const HOUR = 3600e3;
const $ = s => document.querySelector(s);
function el(tag, attrs = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k === 'html') e.innerHTML = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? '' : v);
  }
  for (const k of kids.flat(Infinity)) { if (k == null || k === false) continue; e.append(k.nodeType ? k : document.createTextNode(k)); }
  return e;
}
const svgNS = 'http://www.w3.org/2000/svg';
function sv(tag, attrs = {}, ...kids) {
  const e = document.createElementNS(svgNS, tag);
  for (const [k, v] of Object.entries(attrs)) if (v != null) e.setAttribute(k, v);
  for (const k of kids.flat(Infinity)) if (k != null) e.append(k.nodeType ? k : document.createTextNode(k));
  return e;
}

// ---------- state ----------
const VIEWS = [
  ['overview', 'Overview'], ['map', 'Map'], ['tenday', '10-day'], ['temperature', 'Temperature'], ['rain', 'Rain'], ['clouds', 'Clouds & sky'], ['wind', 'Wind'],
  ['storms', 'Storms & lightning'], ['snow', 'Snow & ice'], ['fire', 'Fire weather'], ['alerts', 'Alerts'], ['table', 'Data table']
];
const state = {
  lat: null, lon: null, label: null,
  units: localStorage.getItem('wx.units') || 'us',
  view: (location.hash.slice(1) || 'overview'),
  data: null, loading: false, error: null, updated: null, geoNote: null
};
if (!VIEWS.some(v => v[0] === state.view)) state.view = 'overview';

// ---------- theme ----------
function applyTheme(t) { document.documentElement.setAttribute('data-theme', t); localStorage.setItem('wx.theme', t); }
applyTheme(localStorage.getItem('wx.theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
$('#themeBtn').onclick = () => { applyTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'); render(); };

// ---------- units ----------
const toF = c => c * 9 / 5 + 32, toMph = k => k / 1.609344, toIn = mm => mm / 25.4, toFt = m => m * 3.28084, toMi = m => m / 1609.344;
const US = () => state.units === 'us';
const fmtT = c => c == null ? '–' : `${Math.round(US() ? toF(c) : c)}°`;
const fmtTu = c => c == null ? '–' : `${Math.round(US() ? toF(c) : c)}°${US() ? 'F' : 'C'}`;
const fmtSpd = k => k == null ? '–' : `${Math.round(US() ? toMph(k) : k)} ${US() ? 'mph' : 'km/h'}`;
const fmtPct = p => p == null ? '–' : `${Math.round(p)}%`;
const fmtLen = mm => mm == null ? '–' : US() ? `${(toIn(mm)).toFixed(mm > 0 && toIn(mm) < 0.01 ? 3 : 2)} in` : `${mm.toFixed(1)} mm`;
const fmtAlt = m => m == null ? '–' : US() ? `${Math.round(toFt(m)).toLocaleString()} ft` : `${Math.round(m).toLocaleString()} m`;
const fmtDist = m => m == null ? '–' : US() ? `${(toMi(m)).toFixed(1)} mi` : `${(m / 1000).toFixed(1)} km`;
const fmtPress = pa => pa == null ? '–' : US() ? `${(pa / 3386.389).toFixed(2)} inHg` : `${Math.round(pa / 100)} hPa`;
const valT = c => c == null ? null : US() ? toF(c) : c;
const valSpd = k => k == null ? null : US() ? toMph(k) : k;
const valLen = mm => mm == null ? null : US() ? toIn(mm) : mm;
const valAlt = m => m == null ? null : US() ? toFt(m) : m;
const DIRS = ['N', 'NNE', 'NE', 'ENE', 'E', 'ESE', 'SE', 'SSE', 'S', 'SSW', 'SW', 'WSW', 'W', 'WNW', 'NW', 'NNW'];
const dirName = d => d == null ? '–' : DIRS[Math.round(d / 22.5) % 16];

// ---------- time ----------
function fmtHour(t, tz) { return new Intl.DateTimeFormat('en-US', { hour: 'numeric', timeZone: tz }).format(new Date(t)).replace(' AM', 'a').replace(' PM', 'p'); }
function fmtTime(t, tz) { return new Intl.DateTimeFormat('en-US', { hour: 'numeric', minute: '2-digit', timeZone: tz }).format(new Date(t)); }
function fmtDT(t, tz) { return new Intl.DateTimeFormat('en-US', { weekday: 'short', hour: 'numeric', minute: '2-digit', timeZone: tz }).format(new Date(t)); }

// Sunrise / sunset (NOAA-style, adapted from the well-known suncalc formulas)
const rad = Math.PI / 180, dayMs = 864e5, J1970 = 2440588, J2000 = 2451545, ecl = rad * 23.4397;
function sunTimes(t, lat, lng) {
  const toDays = ms => ms / dayMs - 0.5 + J1970 - J2000, fromJ = j => (j + 0.5 - J1970) * dayMs;
  const lw = rad * -lng, phi = rad * lat, d = toDays(t), n = Math.round(d - 0.0009 - lw / (2 * Math.PI));
  const ds = 0.0009 + lw / (2 * Math.PI) + n, M = rad * (357.5291 + 0.98560028 * ds);
  const L = M + rad * (1.9148 * Math.sin(M) + 0.02 * Math.sin(2 * M) + 0.0003 * Math.sin(3 * M)) + rad * 102.9372 + Math.PI;
  const dec = Math.asin(Math.sin(ecl) * Math.sin(L)), Jnoon = J2000 + ds + 0.0053 * Math.sin(M) - 0.0069 * Math.sin(2 * L);
  const w = Math.acos((Math.sin(-0.833 * rad) - Math.sin(phi) * Math.sin(dec)) / (Math.cos(phi) * Math.cos(dec)));
  if (isNaN(w)) return null;
  const Jset = J2000 + (0.0009 + (w + lw) / (2 * Math.PI) + n) + 0.0053 * Math.sin(M) - 0.0069 * Math.sin(2 * L);
  return { sunrise: fromJ(Jnoon - (Jset - Jnoon)), sunset: fromJ(Jset) };
}
function isNight(t, lat, lon) { const s = sunTimes(t, lat, lon); if (!s) return false; return t < s.sunrise || t >= s.sunset; }

// ---------- NWS fetch ----------
async function nws(url) {
  const r = await fetch(url, { headers: { Accept: 'application/geo+json' } });
  if (!r.ok) { let msg = `${r.status}`; try { const j = await r.json(); msg = j.detail || j.title || msg; } catch (e) { } throw new Error(msg); }
  return r.json();
}
function parseValid(vt) {
  const [s, d] = vt.split('/');
  const start = Date.parse(s);
  const m = /P(?:(\d+)D)?(?:T(?:(\d+)H)?(?:(\d+)M)?)?/.exec(d || 'PT1H');
  const hrs = (+(m[1] || 0)) * 24 + (+(m[2] || 0)) + (+(m[3] || 0)) / 60;
  return { start, end: start + Math.max(hrs, 1) * HOUR, hours: Math.max(hrs, 1) };
}
function layer(grid, name) {
  const L = grid[name];
  if (!L || !Array.isArray(L.values) || !L.values.length) return null;
  const segs = L.values.map(v => ({ ...parseValid(v.validTime), value: v.value }));

  if (def.key !== 'alerts') ui.legend.append(el('img', { src: `${NOWCOAST}/${def.ws}/wms?service=WMS&version=1.3.0&request=GetLegendGraphic&layer=${encodeURIComponent(name)}&format=image/png&legend_options=fontName:Helvetica;fontSize:11;dpi:96;forceLabels:on`, alt: `${def.name} legend` }));
  if (mapState.showAlerts || def.key === 'alerts') ui.legend.append(el('details', { class: 'legend-details' }, el('summary', {}, 'Alert colours'), el('img', { src: `${NOWCOAST}/alerts/wms?service=WMS&version=1.3.0&request=GetLegendGraphic&layer=${ALERTS_LAYER}&format=image/png&legend_options=fontName:Helvetica;fontSize:10;dpi:96;forceLabels:on`, alt: 'Alerts legend' })));
  let frames = [];
  const frameKey = t => t == null ? 'static' : String(t);
  const ensureFrame = i => {
    const t = frames[i], key = frameKey(t);
    if (!mapState.frameLayers[key]) {
      const opts = { ...wmsBase, layers: name, opacity: 0 };
      if (t != null) opts.time = new Date(t).toISOString();
      mapState.frameLayers[key] = L.tileLayer.wms(`${NOWCOAST}/${def.ws}/wms`, opts).addTo(map);
    }
    return key;
  };
  const showFrame = i => {
    if (ui.gen !== mapState.gen) return;
    mapState.idx = i;
    const key = ensureFrame(i); mapState.curKey = key;
    Object.entries(mapState.frameLayers).forEach(([k, L]) => L.setOpacity(k === key ? mapState.opacity : 0));
    const sl = ui.timeBox.querySelector('input'); if (sl) sl.value = i;
    const ts = ui.timeBox.querySelector('.ts'); const t = frames[i];
    if (ts) ts.textContent = t == null ? '' : `${fmtDT(t, d.tz)} ${def.kind === 'obs' ? '(observed)' : '(forecast)'}`;
  };
  map.on('click', async e => {
    const { lat, lng } = e.latlng;
    const popup = L.popup().setLatLng(e.latlng).setContent('Reading…').openOn(map);
    const body = el('div', {}, el('div', { style: 'font-weight:600' }, `${lat.toFixed(3)}, ${lng.toFixed(3)}`));
    try {
      const size = map.getSize(), b = map.getBounds(), sw = L.CRS.EPSG3857.project(b.getSouthWest()), ne = L.CRS.EPSG3857.project(b.getNorthEast()), pt = map.latLngToContainerPoint(e.latlng);
      const q = async (ws, lyr, time) => { const p = new URLSearchParams({ service: 'WMS', version: '1.3.0', request: 'GetFeatureInfo', layers: lyr, query_layers: lyr, crs: 'EPSG:3857', bbox: `${sw.x},${sw.y},${ne.x},${ne.y}`, width: size.x, height: size.y, i: Math.round(pt.x), j: Math.round(pt.y), info_format: 'application/json', feature_count: 5 }); if (time) p.set('time', time); const r = await fetch(`${NOWCOAST}/${ws}/wms?${p}`); return r.ok ? r.json() : { features: [] }; };
      const t = frames[mapState.idx], time = t == null ? null : new Date(t).toISOString();
      const [main, al] = await Promise.all([q(def.ws, name, time), mapState.showAlerts && def.key !== 'alerts' ? q('alerts', ALERTS_LAYER) : { features: [] }]);
      const fmtRaster = f => { const pr = f.properties || {}; const k = Object.keys(pr).find(k => /band|gray|value/i.test(k)); const v = k == null ? null : pr[k]; if (v == null || typeof v !== 'number') return null; if (def.key === 'radar' && v <= 0) return el('div', { style: 'margin-top:6px' }, `${def.name}: no echo`); return el('div', { style: 'margin-top:6px' }, `${def.name}: `, el('b', {}, `${Math.round(v * 10) / 10}${def.unit ? ' ' + def.unit : ''}`), t == null ? '' : el('span', { class: 'note' }, ` at ${fmtTime(t, d.tz)}`)); };
      const fmtAlert = f => { const pr = f.properties || {}; const title = pr.prod_type || pr.event || 'Alert'; return el('div', { style: 'margin-top:6px' }, el('b', {}, title), pr.wfo ? el('div', { class: 'note' }, `issued by ${pr.wfo}${pr.vtec ? ' · ' + vtecWindow(pr.vtec, d.tz) : ''}`) : null); };
      const got = def.key === 'alerts' ? (main.features || []).map(fmtAlert) : [...(main.features || []).map(fmtRaster), ...(al.features || []).map(fmtAlert)].filter(Boolean);
      body.append(...(got.length ? got : [el('div', { class: 'note' }, `No ${def.name.toLowerCase()} value at this point.`)]));
    } catch (err) { body.append(el('div', { class: 'note' }, 'Could not read the layer value here.')); }
    body.append(el('button', { class: 'btn', onclick: () => { map.closePopup(); load(lat, lng, null, true); } }, 'Forecast for this point'));
    popup.setContent(body);
  });
  ui.status.textContent = def.kind === 'static' ? '' : 'Loading available times…';
  layerTimes(def, name).then(times => {
    if (ui.gen !== mapState.gen) return;
    frames = def.kind === 'static' ? [null] : pickFrames(def, times);
    if (!frames.length) frames = [null];
    ui.status.textContent = frames[0] == null && def.kind !== 'static' ? 'Time steps are unavailable right now; showing the latest image.' : '';
    ui.timeBox.innerHTML = '';
    if (frames.length > 1) {
      const playBtn = el('button', { class: 'btn', onclick: () => mapState.playing ? stopPlay() : startPlay() }, '▶');
      const slider = el('input', { type: 'range', min: 0, max: frames.length - 1, step: 1, value: 0, 'aria-label': 'Time step', oninput: e => { stopPlay(); showFrame(+e.target.value); } });
      ui.timeBox.append(playBtn, slider, el('span', { class: 'ts' }), el('span', {}, def.kind === 'obs' ? `${frames.length} frames over the last ${def.loop} min` : `${frames.length} forecast steps`));
      const startPlay = () => { stopPlay(); mapState.playing = true; playBtn.textContent = '❚❚'; mapState.timer = setInterval(() => { if (ui.gen !== mapState.gen) return stopPlay(); showFrame((mapState.idx + 1) % frames.length); }, 700); };
      const start = mapState.idx != null && mapState.idx < frames.length ? mapState.idx : (def.kind === 'obs' ? frames.length - 1 : 0);
      showFrame(start);
      if (def.kind === 'obs') { frames.forEach((_, i) => ensureFrame(i)); startPlay(); }
    } else { ui.timeBox.append(el('span', { class: 'ts' })); showFrame(0); }
  });
}
function vtecWindow(v, tz) { const m = /(\d{6}T\d{4}Z)-(\d{6}T\d{4}Z)/.exec(v || ''); if (!m) return ''; const P = x => new Date(`20${x.slice(0, 2)}-${x.slice(2, 4)}-${x.slice(4, 6)}T${x.slice(7, 9)}:${x.slice(9, 11)}:00Z`); return `until ${fmtDT(P(m[2]).getTime(), tz)}`; }
function stopPlay() { mapState.playing = false; if (mapState.timer) clearInterval(mapState.timer); mapState.timer = null; const b = document.querySelector('.timectl .btn'); if (b) b.textContent = '▶'; }

// ---------- location handling ----------
async function geocode(q) {
  const m = /^\s*(-?\d+(?:\.\d+)?)\s*,\s*(-?\d+(?:\.\d+)?)\s*$/.exec(q);
  if (m) return { lat: +m[1], lon: +m[2], label: null };
  const r = await fetch(`https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&countrycodes=us,pr,vi,gu,as,mp&q=${encodeURIComponent(q)}`, { headers: { Accept: 'application/json' } });
  const j = await r.json();
  if (!j.length) throw new Error('No matching US place found.');
  const a = j[0], name = a.display_name.split(',').slice(0, 2).map(s => s.trim()).join(', ');
  return { lat: +a.lat, lon: +a.lon, label: name };
}
$('#searchForm').onsubmit = async e => {
  e.preventDefault(); const q = $('#q').value.trim(); if (!q) return;
  try { const g = await geocode(q); load(g.lat, g.lon, g.label, true); } catch (err) { state.error = err.message; state.data = null; render(); }
};
function geolocate(interactive) {
  if (!navigator.geolocation) { if (interactive) alert('Geolocation is not available in this browser.'); return false; }
  navigator.geolocation.getCurrentPosition(
    pos => { state.geoNote = null; load(pos.coords.latitude, pos.coords.longitude, null, true); },
    err => { state.geoNote = `Location access ${err.code === 1 ? 'was denied' : 'failed'}; still showing ${state.label || 'the current location'}.`; render(); },
    { timeout: 8000, maximumAge: 300000 });
  return true;
}
$('#geoBtn').onclick = () => geolocate(true);
$('#uUS').onclick = () => { state.units = 'us'; localStorage.setItem('wx.units', 'us'); render(); };
$('#uSI').onclick = () => { state.units = 'si'; localStorage.setItem('wx.units', 'si'); render(); };
$('#refreshBtn').onclick = () => state.lat != null && load(state.lat, state.lon, state.label);
addEventListener('hashchange', () => { const v = location.hash.slice(1); if (VIEWS.some(x => x[0] === v) && v !== state.view) { state.view = v; render(); } });
document.addEventListener('keydown', e => { if (e.target.tagName === 'INPUT') return; const i = VIEWS.findIndex(v => v[0] === state.view); if (e.key === 'ArrowRight') setView(VIEWS[(i + 1) % VIEWS.length][0]); if (e.key === 'ArrowLeft') setView(VIEWS[(i - 1 + VIEWS.length) % VIEWS.length][0]); });
setInterval(() => { if (state.lat != null && !state.loading && document.visibilityState === 'visible' && state.view !== 'map') load(state.lat, state.lon, state.label); }, 10 * 60e3);

// ---------- boot ----------
(function boot() {
  const qs = new URLSearchParams(location.search);
  if (qs.get('lat') && qs.get('lon')) return load(+qs.get('lat'), +qs.get('lon'), qs.get('name'));
  const saved = localStorage.getItem('wx.loc2');
  if (saved) { try { const s = JSON.parse(saved); load(s.lat, s.lon, s.label); return; } catch (e) { } }
  load(DEFAULT_LOC.lat, DEFAULT_LOC.lon, DEFAULT_LOC.label);
})();
</script>
